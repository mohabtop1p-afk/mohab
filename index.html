<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOHAB STORE | المتجر الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-deep: #030712; --surface: rgba(15, 23, 42, 0.75); --surface-border: rgba(255, 255, 255, 0.08);
            --primary: #06b6d4; --primary-glow: rgba(6, 182, 212, 0.3); --accent: #3b82f6;
            --text-main: #f8fafc; --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Almarai', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-deep); background-image: radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.07) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.07) 0%, transparent 40%); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        nav { position: sticky; top: 0; z-index: 50; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--surface-border); padding: 15px 20px; display: flex; justify-content: center; align-items: center; }
        .main-logo { height: 75px; max-width: 280px; object-fit: contain; filter: drop-shadow(0 0 12px var(--primary-glow)); }
        @media (min-width: 768px) { .main-logo { height: 100px; max-width: 400px; } .games-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); } }

        /* ستايل السلايدر للبانرات */
        .slider-container { max-width: 900px; margin: 20px auto 10px; padding: 0 20px; width: 100%; position: relative; }
        .slider { width: 100%; border-radius: 20px; overflow: hidden; position: relative; aspect-ratio: 21/9; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.15); border: 1px solid var(--surface-border); background: var(--surface); }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.5s ease-in-out; object-fit: cover; }
        .slide.active { opacity: 1; z-index: 1; }
        .slider-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; transition: 0.3s; }
        .dot.active { background: var(--primary); box-shadow: 0 0 8px var(--primary-glow); transform: scale(1.2); }

        .search-container { max-width: 900px; margin: 15px auto; padding: 0 20px; width: 100%; }
        .search-box { position: relative; width: 100%; }
        .search-box input { width: 100%; background: var(--surface); border: 1px solid var(--surface-border); padding: 12px 40px 12px 15px; border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .container { max-width: 900px; margin: 0 auto; padding: 10px 20px 30px; width: 100%; flex: 1; }
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .game-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px; padding: 15px; text-align: center; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .game-card:hover { transform: translateY(-5px); border-color: rgba(6, 182, 212, 0.4); background: rgba(15, 23, 42, 0.9); }
        .game-card img { width: 75px; height: 75px; border-radius: 18px; object-fit: cover; margin-bottom: 12px; border: 2px solid rgba(255,255,255,0.05); }
        .game-card h3 { font-size: 0.95rem; font-weight: 800; margin-bottom: 12px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-view { background: rgba(6, 182, 212, 0.1); color: var(--primary); border: 1px solid rgba(6, 182, 212, 0.3); padding: 7px 0; width: 100%; border-radius: 10px; font-size: 0.75rem; font-weight: 700; transition: 0.3s; }
        .game-card:hover .btn-view { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border-color: transparent; box-shadow: 0 0 10px var(--primary-glow); }

        .contact-section { max-width: 900px; margin: 0 auto 30px; padding: 20px; width: 100%; background: var(--surface); border-radius: 20px; border: 1px solid var(--surface-border); }
        .contact-section h2 { text-align: center; font-size: 1.2rem; margin-bottom: 15px; color: var(--primary); }
        .contact-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .contact-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 12px; text-decoration: none; color: #fff; font-weight: 700; font-size: 0.9rem; transition: 0.3s; }
        .contact-btn:hover { transform: scale(1.02); filter: brightness(1.1); }
        
        /* ألوان أزرار التواصل الديناميكية */
        .bg-whatsapp { background: #25D366; }
        .bg-facebook { background: #1877F2; }
        .bg-telegram { background: #0088cc; }
        .bg-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .bg-youtube { background: #FF0000; }
        .bg-warranty { background: linear-gradient(135deg, #f59e0b, #d97706); }

        /* المودال (النافذة المنبثقة) */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(8px); z-index: 100; opacity: 0; visibility: hidden; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: #0b1329; width: 90%; max-width: 480px; max-height: 85vh; border-radius: 24px; border: 1px solid rgba(255,255,255,0.12); padding: 20px; display: flex; flex-direction: column; transform: scale(0.9); transition: 0.3s; }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title-area { display: flex; align-items: center; gap: 12px; }
        .modal-title-area img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
        .modal-title { font-size: 1.15rem; font-weight: 800; color: #fff; }
        .close-modal { background: rgba(255,255,255,0.06); border: none; color: var(--text-muted); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; }
        .step-panel { display: none; flex-direction: column; flex: 1; overflow-y: hidden; }
        .step-panel.active { display: flex; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-card { background: rgba(255,255,255,0.03); border: 1px solid var(--surface-border); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .option-icon { width: 45px; height: 45px; border-radius: 12px; background: rgba(6, 182, 212, 0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
        .prices-top-bar { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--surface-border); }
        .back-step-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-weight: 700; }
        .prices-grid-container { overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 50vh; }
        .price-card { background: rgba(255,255,255,0.02); border: 1px solid var(--surface-border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .price-name { font-size: 0.85rem; font-weight: 700; }
        .price-val { font-size: 0.95rem; font-weight: 800; color: #10b981; background: rgba(16, 185, 129, 0.08); padding: 4px; border-radius: 6px; text-align: center; }
        .loader { text-align: center; padding: 50px; color: var(--primary); font-size: 2rem; grid-column: 1 / -1; }
        .empty-msg { text-align: center; color: #ef4444; padding: 20px; background: rgba(239, 68, 68, 0.1); border-radius: 12px; grid-column: 1 / -1; width: 100%; }
    </style>
</head>
<body>

    <nav>
        <img id="mainLogoImg" src="" alt="Logo" class="main-logo" style="display:none;">
    </nav>

    <!-- السلايدر الخاص بالبانرات -->
    <div class="slider-container" id="sliderContainer" style="display:none;">
        <div class="slider" id="sliderWrapper">
            <!-- الصور ستضاف هنا برمجياً -->
        </div>
        <div class="slider-dots" id="sliderDots"></div>
    </div>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن لعبتك المفضلة..." onkeyup="filterGames()">
            <i class="fas fa-search"></i>
        </div>
    </div>

    <div class="container">
        <div class="games-grid" id="gamesGrid">
            <div class="loader"><i class="fas fa-spinner fa-spin"></i></div>
        </div>
    </div>

    <!-- أزرار التواصل الديناميكية -->
    <div class="contact-section" id="contactSection" style="display:none;">
        <h2>مركز التواصل والدعم</h2>
        <div class="contact-grid" id="socialLinksGrid">
            <!-- ستضاف الأزرار هنا -->
        </div>
    </div>

    <!-- النافذة المنبثقة للأسعار -->
    <div id="gameModal" class="modal-overlay" onclick="closeOnOutside(event)">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title-area">
                    <img id="modalGameImg" src="" alt="">
                    <div id="modalGameName" class="modal-title">اسم اللعبة</div>
                </div>
                <button class="close-modal" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="stepSelection" class="step-panel active">
                <div class="options-list" id="modalOptionsList"></div>
            </div>
            <div id="stepPrices" class="step-panel">
                <div class="prices-top-bar">
                    <button class="back-step-btn" onclick="goBack()"><i class="fas fa-arrow-right"></i> رجوع</button>
                    <span id="priceTitle" style="color:#fff; font-weight:bold;">الأسعار</span>
                </div>
                <div class="prices-grid-container" id="pricesContent"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAVV1wjaYY1saP5Op9TdY_Snrt7DQcXSwU",
            authDomain: "mohab-store.firebaseapp.com",
            databaseURL: "https://mohab-store-default-rtdb.firebaseio.com",
            projectId: "mohab-store",
            storageBucket: "mohab-store.firebasestorage.app",
            messagingSenderId: "883837761283",
            appId: "1:883837761283:web:87c2c19ea0d0f224eb5b36"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let globalGames = {};
        let currentGameId = null;

        // جلب الإعدادات (اللوجو، البانرات، السوشيال)
        db.ref('settings').on('value', snap => {
            const data = snap.val() || {};
            
            // اللوجو
            if(data.general && data.general.logo) {
                const logo = document.getElementById('mainLogoImg');
                logo.src = data.general.logo;
                logo.style.display = 'block';
            }

            // البانرات (السلايدر)
            const banners = data.banners ? Object.values(data.banners) : [];
            const isAuto = data.general ? (data.general.bannerAutoPlay !== false) : true;
            const speed = data.general ? (data.general.bannerSpeed || 3) * 1000 : 3000;
            initSlider(banners, isAuto, speed);

            // أزرار التواصل
            const socials = data.socials ? Object.values(data.socials) : [];
            renderSocials(socials);
        });

        // دوال السلايدر
        let sliderInterval;
        function initSlider(banners, isAuto, speed) {
            const container = document.getElementById('sliderContainer');
            const wrapper = document.getElementById('sliderWrapper');
            const dotsContainer = document.getElementById('sliderDots');
            
            clearInterval(sliderInterval);
            wrapper.innerHTML = '';
            dotsContainer.innerHTML = '';

            if(banners.length === 0) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'block';

            banners.forEach((url, index) => {
                const img = document.createElement('img');
                img.src = url;
                img.className = index === 0 ? 'slide active' : 'slide';
                wrapper.appendChild(img);

                if(banners.length > 1) {
                    const dot = document.createElement('div');
                    dot.className = index === 0 ? 'dot active' : 'dot';
                    dot.onclick = () => goToSlide(index);
                    dotsContainer.appendChild(dot);
                }
            });

            if(banners.length > 1 && isAuto) {
                sliderInterval = setInterval(() => {
                    let current = Array.from(wrapper.children).findIndex(el => el.classList.contains('active'));
                    let next = (current + 1) % banners.length;
                    goToSlide(next);
                }, speed);
            }
        }

        function goToSlide(index) {
            const slides = document.getElementById('sliderWrapper').children;
            const dots = document.getElementById('sliderDots').children;
            if(!slides.length) return;
            
            for(let i=0; i<slides.length; i++) {
                slides[i].classList.remove('active');
                if(dots[i]) dots[i].classList.remove('active');
            }
            slides[index].classList.add('active');
            if(dots[index]) dots[index].classList.add('active');
        }

        // دالة أزرار التواصل
        function renderSocials(socials) {
            const section = document.getElementById('contactSection');
            const grid = document.getElementById('socialLinksGrid');
            grid.innerHTML = '';
            
            if(socials.length === 0) {
                section.style.display = 'none';
                return;
            }
            section.style.display = 'block';

            const icons = {
                'whatsapp': 'fab fa-whatsapp',
                'facebook': 'fab fa-facebook-f',
                'telegram': 'fab fa-telegram-plane',
                'instagram': 'fab fa-instagram',
                'youtube': 'fab fa-youtube',
                'warranty': 'fas fa-star'
            };

            socials.forEach(s => {
                grid.innerHTML += `
                    <a href="${s.url}" target="_blank" class="contact-btn bg-${s.platform}">
                        <i class="${icons[s.platform] || 'fas fa-link'}"></i> ${s.name}
                    </a>
                `;
            });
        }

        // جلب وترتيب وعرض الألعاب
        db.ref('games').on('value', snap => {
            globalGames = snap.val() || {};
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            
            let gamesArray = Object.keys(globalGames).map(key => ({ key: key, ...globalGames[key] }));
            gamesArray.sort((a, b) => (a.order || 99) - (b.order || 99));

            gamesArray.forEach(g => {
                grid.innerHTML += `
                    <div class="game-card" data-name="${g.name.toLowerCase()}" onclick="openGame('${g.key}')">
                        <img src="${g.img}" alt="${g.name}">
                        <h3>${g.name}</h3>
                        <button class="btn-view">الأسعار</button>
                    </div>
                `;
            });
            if(gamesArray.length === 0) grid.innerHTML = '<div class="empty-msg">لا توجد ألعاب مضافة حالياً</div>';
        });

        function filterGames() {
            let q = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.game-card').forEach(card => {
                card.style.display = card.dataset.name.includes(q) ? "flex" : "none";
            });
        }

        // دوال النافذة المنبثقة
        function openGame(id) {
            currentGameId = id;
            const game = globalGames[id];
            document.getElementById('modalGameName').innerText = game.name;
            document.getElementById('modalGameImg').src = game.img;
            
            const optionsList = document.getElementById('modalOptionsList');
            optionsList.innerHTML = '';
            let hasAnyOption = false;

            if (game.id_available) {
                hasAnyOption = true;
                optionsList.innerHTML += `<div class="option-card" onclick="showPrices('id')"><div class="option-icon"><i class="fas fa-id-card"></i></div><div><h4 style="color:#fff">شحن عن طريق ID</h4></div></div>`;
            }
            if (game.account_available) {
                hasAnyOption = true;
                optionsList.innerHTML += `<div class="option-card" onclick="showPrices('account')"><div class="option-icon"><i class="fas fa-user-shield"></i></div><div><h4 style="color:#fff">شحن عن طريق الحساب</h4></div></div>`;
            }
            if (!hasAnyOption) optionsList.innerHTML = '<div class="empty-msg">غير متوفر حالياً</div>';

            document.getElementById('stepSelection').classList.add('active');
            document.getElementById('stepPrices').classList.remove('active');
            
            const modal = document.getElementById('gameModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function showPrices(type) {
            const game = globalGames[currentGameId];
            const pricesStr = type === 'id' ? game.id_prices : game.account_prices;
            const content = document.getElementById('pricesContent');
            
            if (!pricesStr || pricesStr.trim() === '') {
                content.innerHTML = '<div class="empty-msg">لا توجد أسعار مدخلة</div>';
            } else {
                const lines = pricesStr.split('\n');
                content.innerHTML = lines.map(line => {
                    let parts = line.split('=');
                    if(parts.length === 2) return `<div class="price-card"><span class="price-name">${parts[0].trim()}</span><span class="price-val">${parts[1].trim()}</span></div>`;
                    return '';
                }).join('');
            }

            document.getElementById('stepSelection').classList.remove('active');
            document.getElementById('stepPrices').classList.add('active');
        }

        function goBack() {
            document.getElementById('stepPrices').classList.remove('active');
            document.getElementById('stepSelection').classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('gameModal');
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function closeOnOutside(e) { if (e.target.classList.contains('modal-overlay')) closeModal(); }
    </script>
</body>
</html>
